name: build-windows

# Builds the app on a Windows runner and publishes dist/ as an artifact, so the
# machine that runs OpenRPA does not need Visual Studio, NuGet access, or admin
# rights. Every project in the solution outputs to the shared ..\dist folder in
# Release, so that one folder is the runnable app.

on:
  push:
    branches: [ "ui/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # LiteDB, Open3270 and vb5250 are submodules; without them msbuild fails
      # with MSB3202 on the missing project files.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - uses: nuget/setup-nuget@v2

      # OpenRPA.SAP and OpenRPA.SAPBridge bind to SAP GUI COM interop assemblies
      # that only exist on a machine with SAP GUI installed, so they can never
      # build here. Drop them from the solution for this build only.
      - name: Drop SAP projects from the solution
        shell: pwsh
        run: |
          $sln = Get-Content OpenRPA.sln -Raw
          foreach ($name in 'OpenRPA.SAP', 'OpenRPA.SAPBridge') {
            $pattern = '(?ms)^Project\([^)]*\) = "' + [regex]::Escape($name) + '",.*?^EndProject\r?\n'
            $sln = [regex]::Replace($sln, $pattern, '')
          }
          Set-Content OpenRPA.sln -Value $sln -NoNewline
          if (Select-String -Path OpenRPA.sln -Pattern 'OpenRPA\.SAP' -Quiet) {
            throw "SAP projects still present in the solution"
          }

      # Two projects (OpenRPA.RDService, OpenRPA.IE) still use packages.config,
      # which msbuild -t:Restore does not cover.
      - name: Restore packages
        run: nuget restore OpenRPA.sln

      # The WiX installer project has no Build.0 entry for Release|Any CPU, so
      # it is skipped without needing to be excluded here.
      - name: Build
        run: msbuild OpenRPA.sln -p:Configuration=Release -p:Platform="Any CPU" -m -v:minimal

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: openrpa-dist
          path: dist/
          if-no-files-found: error
